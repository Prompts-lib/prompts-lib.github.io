<html lang="en">
<head>
<meta charset="utf-8">

<meta property="og:description" content="A searchable library of AI prompts for learning, personal finance, LinkedIn, and photo editing.">

<title>Prompt Library</title>
<style>
* { box-sizing: border-box; }
:root { --bg: #f1f5f9; --header-bg: #f8fafc; --card: #fff; --ink: #0f172a; --body-text: #334155; --muted: #475569; --brand: #1d4ed8; --brand-dark: #1e40af; --line: #e2e8f0; --pale: #eff6ff; --box-bg: #f1f5f9; }
body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--body-text); line-height: 1.55; }
header { position: sticky; top: 0; z-index: 10; background: var(--header-bg); border-bottom: 1px solid var(--line); }
.header-inner { max-width: 1200px; margin: 0 auto; padding: .9rem 1.5rem; display: flex; align-items: center; }
.wordmark { margin: 0; font-size: 1.35rem; font-weight: 800; color: var(--brand); line-height: 1.2; }
main { max-width: 1200px; margin: 0 auto; padding: 1rem 1.5rem 3rem; }
.hero { text-align: center; padding: 2.5rem 1rem 1.5rem; }
.hero-title { margin: 0 0 .75rem; font-size: 2.5rem; line-height: 1.15; font-weight: 800; color: var(--brand); }
.tagline { margin: 0 auto; color: var(--muted); font-size: 1.1rem; max-width: 640px; }
.controls { display: flex; justify-content: center; margin: 1.5rem 0 1rem; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
#search { flex: 0 1 640px; width: 100%; padding: .85rem 1.25rem; font-size: 1rem; border: 1px solid var(--line); border-radius: .75rem; background: var(--header-bg); color: var(--ink); box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06); }
#search:focus { border-color: var(--brand); }
.filters { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem; margin-bottom: .5rem; }
button { font: inherit; cursor: pointer; }
.pill { padding: .5rem 1rem; border: 1px solid #dbeafe; border-radius: 999px; background: var(--pale); color: var(--brand); font-weight: 600; }
.pill[aria-pressed="true"] { background: var(--brand); color: #fff; border-color: var(--brand); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
#count { font-weight: 600; margin: .75rem 0 1.5rem; color: var(--muted); text-align: center; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
article { background: var(--card); border: 1px solid var(--line); border-radius: 1rem; padding: 1.5rem; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06); display: flex; flex-direction: column; }
article h2 { margin: 0 0 .5rem; font-size: 1.2rem; color: var(--ink); line-height: 1.3; }
.category { display: block; font-size: .8rem; font-weight: 800; color: var(--brand); margin-bottom: .5rem; }
.note { color: #475569; margin: 0 0 1rem; }
.body { background: var(--box-bg); border: 1px solid var(--line); border-radius: .75rem; padding: 1rem; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: .9rem; color: var(--body-text); }
.body.collapsed { max-height: 6.4rem; overflow: hidden; }
.body p { margin: 0 0 .6rem; white-space: pre-wrap; }
.body p:last-child { margin-bottom: 0; }
mark { background: #dbeafe; color: var(--ink); padding: 0 .15rem; border-radius: .2rem; }
.toggle-row { margin-top: .75rem; }
.toggleBtn { background: none; border: none; padding: 0; color: var(--brand); font-weight: 700; }
.actions { display: flex; gap: .5rem; margin-top: 1rem; }
.copyBtn { padding: .55rem 1.1rem; border-radius: .5rem; border: 1px solid var(--brand); background: var(--brand); color: #fff; font-weight: 600; }
.copyBtn:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
footer { border-top: 1px solid var(--line); padding: 1.25rem 1rem 2rem; text-align: center; color: var(--muted); font-size: .9rem; }
footer p { margin: 0; }
@media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .grid { grid-template-columns: 1fr; } .hero-title { font-size: 2rem; } .hero { padding-top: 1.5rem; } article { padding: 1.25rem; } main { padding-left: 1rem; padding-right: 1rem; } .header-inner { padding-left: 1rem; padding-right: 1rem; } }
</style>
</head>
<body>
<header>
<div class="header-inner">
<p class="wordmark">Prompt Library</p>
</div>
</header>
<main>
<section class="hero">
<h1 class="hero-title">Prompt Library</h1>
<p class="tagline">Copy-ready AI prompts for learning, personal finance, LinkedIn, and photo editing.</p>
</section>
<div class="controls">
<label class="sr-only" for="search">Search prompts</label>
<input id="search" type="search" placeholder="Search titles and prompt text…">
</div>
<div class="filters" role="group" aria-label="Filter by category">
<button class="pill" type="button" data-category="All" aria-pressed="true">All</button>
<button class="pill" type="button" data-category="Learning" aria-pressed="false">Learning</button>
<button class="pill" type="button" data-category="Personal Finance" aria-pressed="false">Personal Finance</button>
<button class="pill" type="button" data-category="LinkedIn" aria-pressed="false">LinkedIn</button>
<button class="pill" type="button" data-category="Photo Editing" aria-pressed="false">Photo Editing</button>
</div>
<p id="count" aria-live="polite"></p>
<div class="grid" id="list"></div>
<noscript><p>Enable JavaScript to search, filter, and copy prompts.</p></noscript>
</main>
<footer><p>33 prompts · Prompt Library</p></footer>
<script>
const PROMPTS = [
{"id":1,"title":"The Learning Curve Destroyer","category":"Learning","body":"You are a teacher who has only 4 hours with me and will never see me again.\n\nYour only objective is to make me functional in [SKILL] before the time runs out. Do not give me theory without practical use, and do not give me a generic list.\n\nTell me three things: what to learn first, what to ignore completely, and the one exercise that, done a single time, would put me ahead of 70% of people who have studied this for months.\n\nThen teach me the first step and wait for my response before continuing.","note":"For picking up any new skill fast — what to learn first, what to skip, and the one exercise that matters most."},
{"id":2,"title":"The Real Mistake Simulator","category":"Learning","body":"Do not explain [CONCEPT] to me.\n\nPut me directly into a realistic situation where I would have to use it and would probably make a mistake. Then wait for my response.\n\nWhen I make a mistake, do not give me the answer. Ask me one question that forces me to find where my reasoning broke.\n\nGive me the answer only after I have tried at least twice. Then repeat the cycle with a new situation until I can get it right without hesitation.","note":"Learn by doing: get dropped into a realistic scenario and find your own mistakes before being told the answer."},
{"id":3,"title":"The Impossible Language Translator","category":"Learning","body":"The content below is confusing to me.\n\nBefore explaining anything, tell me the one core idea that, once I understand it, makes the rest fall into place.\n\nExplain only that idea first, using an everyday analogy and no technical terms.\n\nThen ask me 3 questions that only someone who truly understood it could answer. Ask them one at a time and wait for my answers.\n\nDo not move on to the rest until I pass all three.\n\n[PASTE THE CONTENT HERE]","note":"Paste in confusing material and get the one core idea first, explained with an everyday analogy, then get quizzed on it."},
{"id":4,"title":"The Personal Path Architect","category":"Learning","body":"My real goal is [GOAL]. It is not to learn [SKILL] in general. It is to achieve [SPECIFIC RESULT] within [DEADLINE].\n\n• already know [WHAT I ALREADY KNOW].\n\nBased on that, build me a 7-day learning path. Each day must include: one single task that fits within 45 minutes, a clear criterion so I know whether I did it correctly, and what not to do that day so I do not waste time.\n\nIf the entire path does not lead me to the goal, rebuild it until it does.","note":"Turns a real goal and deadline into a 7-day path of 45-minute daily tasks."},
{"id":5,"title":"The Hidden Gap Detector","category":"Learning","body":"I think I already master [SKILL]. I want you to prove me wrong.\n\nAsk me 5 questions that seem simple but expose the gaps of someone who has never truly gone deep.\n\nAsk them one at a time and wait for each answer.\n\nAfter every answer, tell me what it reveals about what is still missing in my foundation.\n\nDo not go easy on me. If I am being shallow, tell me directly.","note":"Five seemingly simple questions that expose shallow understanding."},
{"id":6,"title":"The Forced Feynman Method","category":"Learning","body":"I just studied [TOPIC].\n\nI am going to explain what I understood as if you were a 10-year-old child.\n\nWait for my explanation. While I explain, stop me every time I use jargon I cannot define, skip a step in the reasoning, or simplify something so much that it becomes wrong.\n\nAt the end, tell me exactly what those mistakes reveal about what is still not solid in my understanding.","note":"Explain a topic as if teaching a 10-year-old and get stopped wherever your understanding is shaky."},
{"id":7,"title":"Financial Clarity","category":"Personal Finance","body":"Here are my monthly income and expenses: [insert the values]. Create a realistic, stress-free budget that includes savings, fixed costs, essential expenses, and a guilt-free amount for leisure.","note":"Turn your income and expenses into a realistic budget with savings and guilt-free leisure covered."},
{"id":8,"title":"Leak Detector","category":"Personal Finance","body":"Based on these expenses: [paste your expenses], identify where I'm wasting money and how I can reduce those expenses without lowering my quality of life.","note":"Find where money is leaking and how to cut it without lowering your quality of life."},
{"id":9,"title":"Income Expansion","category":"Personal Finance","body":"Considering my current income of [$X per month], suggest three realistic ways to increase my income from what I already know how to do. For each, indicate the effort required, the time to first results, and the main risk.","note":"Three realistic ways to earn more from skills you already have, with effort, timeline, and risk for each."},
{"id":10,"title":"Emergency Fund","category":"Personal Finance","body":"Create a savings plan that allows me to build an emergency fund equivalent to three months of my cost of living in [X months], considering my current income and expenses.","note":"A savings plan to build a three-month emergency fund on your current income."},
{"id":11,"title":"Debt Elimination","category":"Personal Finance","body":"I have these debts: [each debt, interest rate, and payment]. Create an aggressive but viable repayment plan to eliminate them using either the Avalanche method (highest rates first) or the Snowball method (smallest debts first). Explain which strategy makes more sense in my case.","note":"An aggressive but viable payoff plan — Avalanche vs Snowball, and which fits your debts."},
{"id":12,"title":"Budget From Scratch","category":"Personal Finance","body":"Help me create a budget from scratch for next month, where every dollar of my income has a defined purpose: food, housing, leisure, investments, financial reserves, and personal development.","note":"A zero-based budget for next month where every dollar has a job."},
{"id":13,"title":"Financial Mindset","category":"Personal Finance","body":"Create a five-minute daily exercise with reflections and practical actions to develop a healthier relationship with money, reduce a scarcity mindset, and strengthen a conscious abundance mindset.","note":"Five minutes a day to change your relationship with money."},
{"id":14,"title":"Headline Fix","category":"LinkedIn","body":"Rewrite my LinkedIn headline so it sounds like a top 1% operator in [industry].\n\nMake it:\n• Specific\n• Results-driven\n• Impossible to scroll past\n\nGive me 10 variations.\n\nCurrent profile: [paste here]","note":"Ten headline variations that sound like a top 1% operator in your industry."},
{"id":15,"title":"About Section Rewrite","category":"LinkedIn","body":"Turn my About section into a story that hooks recruiters in the first 2 lines.\n\nUse the PAS framework:\nProblem → Agitate → Solution\n\nKeep it under 2000 characters and end with a strong CTA.\n\nCurrent profile: [paste here]","note":"Rewrites your About section as a PAS-framework story that hooks recruiters in two lines."},
{"id":16,"title":"Experience Glow-Up","category":"LinkedIn","body":"Rewrite each job description using the XYZ formula:\n\nAccomplished X\nby doing Y\nresulting in Z.\n\nAdd metrics where possible.\n\nMake me sound impactful, not task-based.","note":"Rewrites job descriptions with the XYZ formula — impact and metrics, not tasks."},
{"id":17,"title":"Skills + Keywords Audit","category":"LinkedIn","body":"Act as a LinkedIn SEO expert.\n\nBased on my target role of [role]:\n\n• List the top 25 recruiter keywords\n• Tell me which ones are missing\n• Show where to insert them naturally","note":"The top 25 recruiter keywords for your target role, which ones you're missing, and where they belong."},
{"id":18,"title":"Recruiter Magnet Test","category":"LinkedIn","body":"Roleplay as a senior recruiter at [target company].\n\nRead my profile and tell me:\n\n• Would you reach out?\n• Why or why not?\n• What are the 5 biggest red flags?\n\nBe brutally honest.","note":"A brutally honest recruiter's-eye review of your profile, red flags included."},
{"id":19,"title":"Featured Section Strategy","category":"LinkedIn","body":"Suggest 5 things I should pin in my Featured section for [target role].\n\nTell me:\n\n• What each should say\n• Why it builds credibility\n• What recruiters notice first","note":"Five things to pin in your Featured section, and what each should say."},
{"id":20,"title":"Outreach DM Templates","category":"LinkedIn","body":"Write me 3 cold DM templates for recruiters at [dream companies].\n\nMake them:\n\n• Short\n• Personal\n• Impossible to ignore\n\nNo corporate fluff.","note":"Three short, personal cold DM templates for recruiters — no corporate fluff."},
{"id":21,"title":"DSLR Portrait","category":"Photo Editing","body":"Transform my uploaded photo into a professional DSLR-style portrait. Preserve my recognizable facial features, facial structure, skin tone, hairstyle, and identity. Place me in [LOCATION]. Use realistic lighting, natural skin texture, shallow depth of field, subtle background separation, realistic lens perspective, professional composition, and authentic photographic detail. The final result should feel like a genuine photograph taken by a skilled photographer, not an artificial or overly retouched image.","note":"Make your photo look like it was captured by a professional photographer."},
{"id":22,"title":"Cinematic Photoshoot","category":"Photo Editing","body":"Turn my uploaded photo into a professional cinematic photo shoot. Place me in [SCENE] with dramatic yet realistic lighting, natural shadows, shallow depth of field, subtle background blur, cinematic composition, realistic skin texture, detailed clothing, and professional color grading. Keep my identity and facial features consistent. The final image should look like a real photograph from a high-end cinematic photo shoot.","note":"Movie-poster lighting without the Hollywood budget."},
{"id":23,"title":"Luxury Instagram Photo","category":"Photo Editing","body":"Transform my uploaded photo into a premium lifestyle photograph suitable for a high-end Instagram profile. Place me in [LUXURY LOCATION], wearing [OUTFIT], with sophisticated lighting, realistic environmental details, a natural pose, professional composition, shallow depth of field, and authentic skin texture. Make the image look luxurious and editorial without appearing artificial or overly edited.","note":"Editorial lifestyle photography for your profile."},
{"id":24,"title":"Travel Photo Anywhere","category":"Photo Editing","body":"Turn my uploaded photo into a professional, authentic travel photograph taken in [DESTINATION]. Keep my face and identity consistent while naturally integrating me into the location. Realistically adapt the lighting, shadows, perspective, weather, clothing, and surroundings. Use professional travel photography composition with realistic depth, natural colors, a detailed environment, and subtle background separation.","note":"Place yourself anywhere in the world with matching lighting and weather."},
{"id":25,"title":"Restore Old Photos","category":"Photo Editing","body":"Restore and enhance my uploaded photo into a natural, high-quality portrait. Preserve the person's true facial identity and original features. Improve lighting, sharpness, exposure, skin detail, composition, and background while keeping the result realistic. Avoid over-smoothing, changing facial features, or adding details that were not present. Make it look as if the original photo was carefully captured with a modern professional camera.","note":"Bring an old or low-quality photo closer to modern camera quality."},
{"id":26,"title":"LinkedIn Profile Photo","category":"Photo Editing","body":"Transform my uploaded photo into a professional profile picture suitable for LinkedIn, a company website, or a personal brand. Keep my face, facial structure, skin tone, hairstyle, and identity recognizable and natural. Use clean professional lighting, realistic skin texture, a natural expression, subtle background separation, sharp facial details, and a polished composition. Make it look like a real portrait taken by a professional photographer using a high-end camera.","note":"A clean, professional profile picture."},
{"id":27,"title":"Create a 30-Day LinkedIn Growth Plan","category":"LinkedIn","body":"Ask ChatGPT to build a practical 30-day LinkedIn strategy to improve profile visibility, grow relevant connections, and attract jobs, clients, or business opportunities, with a weekly action plan, weekly content ideas, networking message templates, and simple ways to track progress, assuming no paid LinkedIn tools.","note":"A month-long plan to grow your LinkedIn presence."},
{"id":28,"title":"Optimize My Experience Section","category":"LinkedIn","body":"Ask ChatGPT to rewrite your work experience around measurable achievements rather than plain job descriptions, turning responsibilities into strong bullet points with action verbs, metrics, and business impact, without inventing achievements or numbers.","note":"Turns job duties into achievement-led bullet points."},
{"id":29,"title":"Build Social Proof","category":"LinkedIn","body":"Ask ChatGPT to strengthen your LinkedIn profile using your real accomplishments: personalized recommendation requests for former colleagues, managers, or clients, plus ideas for projects, certifications, and portfolio items that demonstrate your expertise.","note":"Builds credibility with recommendations and portfolio ideas."},
{"id":30,"title":"LinkedIn Profile Audit","category":"LinkedIn","body":"Ask ChatGPT to act as a LinkedIn optimization expert, review your current profile, and list the biggest mistakes hurting your visibility, credibility, and career opportunities, with a specific fix for each.","note":"Spots the biggest profile mistakes and how to fix them."},
{"id":31,"title":"Write a Powerful Headline","category":"LinkedIn","body":"Ask ChatGPT to rewrite your LinkedIn headline to attract recruiters, clients, and industry professionals, using your role, skills, and target audience, and to offer several keyword-rich headline options that communicate your value clearly.","note":"Headline options that state your value clearly."},
{"id":32,"title":"Find the Right Keywords","category":"LinkedIn","body":"Ask ChatGPT to analyze your target role and industry and identify the most relevant LinkedIn search keywords — skills, job titles, and industry terms — and explain where to include them naturally without keyword stuffing.","note":"Finds the search terms recruiters actually use."},
{"id":33,"title":"Transform My About Section","category":"LinkedIn","body":"Ask ChatGPT to rewrite your LinkedIn About section as a compelling, easy-to-scan professional story covering your experience, strongest skills, achievements, and career goals, optimized for relevant LinkedIn keywords, using your background details.","note":"Turns your background into a scannable professional story."}
];
let activeCategory = "All";
const listEl = document.getElementById("list");
const countEl = document.getElementById("count");
const searchEl = document.getElementById("search");
function appendHighlighted(el, text) {
  const parts = String(text).split(/(\[[^\]]+\])/g);
  parts.forEach(function (part) {
    if (!part) return;
    if (/^\[[^\]]+\]$/.test(part)) {
      const m = document.createElement("mark");
      m.textContent = part;
      el.appendChild(m);
    } else {
      el.appendChild(document.createTextNode(part));
    }
  });
}
function renderBody(container, body) {
  String(body).split(/\n\s*\n/).forEach(function (para) {
    const p = document.createElement("p");
    para.split("\n").forEach(function (line, i) {
      if (i > 0) p.appendChild(document.createElement("br"));
      appendHighlighted(p, line);
    });
    container.appendChild(p);
  });
}
function copyText(text, btn) {
  function done() {
    const original = btn.textContent;
    btn.textContent = "Copied ✓";
    setTimeout(function () { btn.textContent = original; }, 2000);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text, done); });
  } else { fallbackCopy(text, done); }
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
  done();
}
function render() {
  const q = searchEl.value.trim().toLowerCase();
  const shown = PROMPTS.filter(function (p) {
    if (activeCategory !== "All" && p.category !== activeCategory) return false;
    if (q && (p.title + " " + p.body).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  listEl.textContent = "";
  shown.forEach(function (p) {
    const card = document.createElement("article");
    const cat = document.createElement("span");
    cat.className = "category";
    cat.textContent = p.category;
    card.appendChild(cat);
    const h2 = document.createElement("h2");
    h2.textContent = p.title;
    card.appendChild(h2);
    if (p.note) {
      const note = document.createElement("p");
      note.className = "note";
      note.textContent = p.note;
      card.appendChild(note);
    }
    const bodyDiv = document.createElement("div");
    bodyDiv.className = "body";
    renderBody(bodyDiv, p.body);
    card.appendChild(bodyDiv);
    if (p.body.length > 300) {
      bodyDiv.classList.add("collapsed");
      const toggleRow = document.createElement("div");
      toggleRow.className = "toggle-row";
      const toggleBtn = document.createElement("button");
      toggleBtn.type = "button";
      toggleBtn.className = "toggleBtn";
      toggleBtn.textContent = "Show more";
      toggleBtn.setAttribute("aria-expanded", "false");
      toggleBtn.setAttribute("aria-label", "Show more of " + p.title);
      toggleBtn.addEventListener("click", function () {
        const collapsed = bodyDiv.classList.toggle("collapsed");
        toggleBtn.textContent = collapsed ? "Show more" : "Show less";
        toggleBtn.setAttribute("aria-expanded", collapsed ? "false" : "true");
      });
      toggleRow.appendChild(toggleBtn);
      card.appendChild(toggleRow);
    }
    const actions = document.createElement("div");
    actions.className = "actions";
    const copyBtn = document.createElement("button");
    copyBtn.type = "button";
    copyBtn.className = "copyBtn";
    copyBtn.textContent = "Copy prompt";
    copyBtn.setAttribute("aria-label", "Copy " + p.title);
    copyBtn.addEventListener("click", function () { copyText(p.body, copyBtn); });
    actions.appendChild(copyBtn);
    card.appendChild(actions);
    listEl.appendChild(card);
  });
  countEl.textContent = "Showing " + shown.length + " of " + PROMPTS.length + " prompts";
  if (shown.length === 0) {
    const empty = document.createElement("p");
    empty.textContent = "No prompts match your search and filters.";
    listEl.appendChild(empty);
  }
}
document.querySelectorAll(".pill").forEach(function (btn) {
  btn.addEventListener("click", function () {
    activeCategory = btn.getAttribute("data-category");
    document.querySelectorAll(".pill").forEach(function (b) {
      b.setAttribute("aria-pressed", b === btn ? "true" : "false");
    });
    render();
  });
});
searchEl.addEventListener("input", render);
render();
</script>
</body>
</html>
